COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

FEATURES="splitdebug"
LLVM_SLOT="22"
PYTHON_SINGLE_TARGET="python3_13"
PYTHON_TARGETS="python3_13"
ACCEPT_LICENSE="-* @FREE"
LC_MESSAGES=C.UTF-8
USE="-systemd -doc -ldap -mysql -wayland -ruby -accessibility -smartcard -bluetooth -telemetry -cups -jack -oss -gpm -gnome -kde -plasma -qt5 -qt6 emoji bash-completion pipewire unicode threads lto opengl vulkan vaapi minimal"
INPUT_DEVICES="libinput"
EMERGE_DEFAULT_OPTS="-avqt --autounmask --with-bdeps=y"

